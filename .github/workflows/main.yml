name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Android Project & Gradle Wrapper
        run: |
          echo "=== 1. Detecting Project Directory ==="
          ls -la

          if [ -f "build.gradle.kts" ] || [ -f "build.gradle" ]; then
            TARGET_DIR="."
          elif [ -d "android" ]; then
            TARGET_DIR="android"
          else
            TARGET_DIR="."
          fi

          echo "Selected target directory: $TARGET_DIR"
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV
          cd $TARGET_DIR

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "Installing standard Gradle wrapper..."
            gradle wrapper --gradle-version 8.4
            chmod +x ./gradlew
          fi

      - name: Build Android App Bundle (AAB)
        run: |
          cd ${{ env.TARGET_DIR }}
          chmod +x ./gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: laqta-app-release-aab
          path: |
            **/build/outputs/bundle/release/*.aab
            **/*.aab
          retention-days: 30
