name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir android-project
          unzip -q *.zip -d android-project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find android-project -name settings.gradle.kts -o -name settings.gradle | head -1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Gradle settings
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradle.properties ]; then
            sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8/' gradle.properties
          fi

      - name: Build AAB
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          gradle bundleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: laqta-release-aab
          path: "**/build/outputs/bundle/release/*.aab"
